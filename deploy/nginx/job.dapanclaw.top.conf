upstream dapan_job_board {
    server 127.0.0.1:58112;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name job.dapanclaw.top;

    ssl_certificate /etc/nginx/certs/job.dapanclaw.top_cert.pem;
    ssl_certificate_key /etc/nginx/certs/job.dapanclaw.top_key.pem;
    include /etc/nginx/conf.d/cloudflare-realip.inc;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 1000m;

    location / {
        proxy_pass http://dapan_job_board;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 3600s;
    }
}
