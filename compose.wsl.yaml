services:
  app:
    network_mode: host
    ports: !reset []
    dns:
      - 223.5.5.5
      - 1.1.1.1
    command:
      - uvicorn
      - app:app
      - --app-dir
      - /app/backend
      - --host
      - 127.0.0.1
      - --port
      - ${HOST_PORT:-58112}
      - --workers
      - "1"
      - --no-access-log
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('HOST_PORT','58112') + '/api/health',timeout=3)"]
